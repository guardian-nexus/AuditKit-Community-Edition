name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
# Pages allows one deployment at a time. Without this, pushing several commits
# in quick succession makes the later runs fail with "in progress deployment"
# even though nothing is wrong.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
