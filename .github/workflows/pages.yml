name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      # The coverage check reads these, so a change here can invalidate a
      # number the documentation states.
      - 'scanner/pkg/*/checks/**'
      - 'scanner/pkg/mappings/framework-crosswalk.yaml'
      - '.github/scripts/check-links.sh'
      - '.github/scripts/coverage-counts.py'
      - '.github/coverage-claims.json'
      - '.github/workflows/pages.yml'
# Pages allows one deployment at a time. Without this, pushing several commits
# in quick succession makes the later runs fail with "in progress deployment"
# even though nothing is wrong.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify local links resolve
        run: .github/scripts/check-links.sh

      - name: Verify documented coverage matches the code
        run: .github/scripts/coverage-counts.py --check

  deploy:
    needs: check-links
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
