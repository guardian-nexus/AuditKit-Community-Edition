name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The job reads the repository and nothing else. Without this block it ran
# with the repository's default token, which may be read-write, so a
# compromised step or action could push to the repository.
permissions:
  contents: read

jobs:
  vet-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi





      # Lint is a gate now that both configurations load and both trees are
      # clean; the previous configuration loaded under no release of the tool.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: scanner
          # Loading every provider SDK exceeds the 1m default on a shared runner.
          args: --timeout=15m

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build all scanner variants
        run: |
          go build -o /dev/null ./cmd/auditkit
