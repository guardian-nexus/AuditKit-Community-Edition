# golangci-lint v2 configuration, run by `make lint`.
#
# The previous file was v1-shaped (Community) or a v2 header over v1 keys
# (Pro), and loaded under no release of the tool, so lint never ran. This one
# is verified with `golangci-lint config verify` under v2.5. gosimple is part
# of staticcheck in v2; typecheck is not a linter.
version: "2"

run:
  timeout: 5m
  tests: false

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (*database/sql.Rows).Close
        - (*os.File).Close
    staticcheck:
      checks:
        # Correctness (SA) and simplification (S) checks. The style (ST) and
        # quickfix (QF) families are opinion, and enabling them reported 969
        # findings on Pro against 87 of substance.
        - all
        - -ST*
        - -QF*
        - -S1039 # fmt.Sprintf of a constant, kept for consistency
  exclusions:
    rules:
      - source: 'defer.*\.Close\(\)'
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
